{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <span class="eyebrow">WELCOME BACK</span><h1 class="h2 mt-2">Sign in to PearlBank</h1>
  <p class="text-secondary">Access your account overview and recent transactions.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required autocomplete="username"></div>
    <div class="mb-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100 btn-lg">Sign in securely</button>
  </form>
  <p class="text-center mt-4 mb-0">New to PearlBank? <a href="{{ url_for('register') }}">Open an account</a></p>
</div></div>
{% endblock %}
